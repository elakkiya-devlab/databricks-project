name: SentinelX CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m compileall -q backend dashboard configs scripts scoring
      - run: docker build -f deployment/Dockerfile -t sentinelx:ci .