services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env
    environment:
      SENTINELX_DB_PATH: /app/.local/sentinelx.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/app/.local
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: [python, -m, streamlit, run, dashboard/app.py, --server.address, 0.0.0.0]
    environment:
      SENTINELX_API_URL: http://api:8000
      DEMO_MODE: "false"
      LIVE_MODE: "true"
      SENTINELX_READER_KEY: ${SENTINELX_READER_KEY:?Set reader key}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on: [api]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  data: